name: Structure Refactor Verify

on:
  push:
    branches:
      - stabilization/wilddash-prototype

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply structure refactor
        run: |
          node scripts/structure-refactor.cjs
          sed -i 's/AI_EMOJIS, BOXES, LANES, OBSTACLES, ROUTES/AI_EMOJIS, LANES, ROUTES/' app/page.tsx

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Persist refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/Race3D.tsx app/Tutorial.tsx package.json tsconfig.json
          git commit -m "refactor: split game configuration and systems [skip ci]"
          git push
