name: WILD DASH Grand Prix Pack CI

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/grand-prix-pack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grand-prix-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify Casual 10-racer field
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=9
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-10"
          timeout 150s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/pack-10.log
          grep -q "GRAND PRIX START racers=10 ai=9 checkpoints=11" /tmp/pack-10.log
          grep -q "START GRID PASS columns=4 racers=10" /tmp/pack-10.log
          grep -q "10 RACERS PASS" /tmp/pack-10.log
          grep -q "AI ITEM USE" /tmp/pack-10.log
          grep -q "AI SKILL USE" /tmp/pack-10.log
          grep -q "AI SHORTCUT PASS" /tmp/pack-10.log
          grep -q "RANK SYSTEM PASS racers=10" /tmp/pack-10.log
          echo "AI ITEM USE PASS"
          echo "AI SKILL USE PASS"

      - name: Verify Normal 15-racer gameplay target
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=14
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-15"
          timeout 165s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/pack-15.log
          grep -q "GRAND PRIX START racers=15 ai=14 checkpoints=11" /tmp/pack-15.log
          grep -q "START GRID PASS columns=4 racers=15" /tmp/pack-15.log
          grep -q "RC5 GRAND PRIX ITEM BOXES PASS count=36 target=36 stations=11 respawn=4.0s" /tmp/pack-15.log
          grep -q "15 RACERS PASS" /tmp/pack-15.log
          grep -q "15 RACERS ALL FINISH PASS" /tmp/pack-15.log
          grep -q "AI ITEM USE" /tmp/pack-15.log
          grep -q "AI SKILL USE" /tmp/pack-15.log
          grep -q "AI PACK TACTIC" /tmp/pack-15.log
          grep -q "AI SHORTCUT PASS" /tmp/pack-15.log
          grep -q "RANK SYSTEM PASS racers=15" /tmp/pack-15.log
          echo "AI ITEM USE PASS"
          echo "AI SKILL USE PASS"

      - name: Verify Hard 18-racer field
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=17
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-18"
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/pack-18.log
          grep -q "GRAND PRIX START racers=18 ai=17 checkpoints=11" /tmp/pack-18.log
          grep -q "START GRID PASS columns=4 racers=18" /tmp/pack-18.log
          grep -q "RC5 GRAND PRIX ITEM BOXES PASS count=36 target=36 stations=11 respawn=3.6s" /tmp/pack-18.log
          grep -q "18 RACERS PASS" /tmp/pack-18.log
          grep -q "18 RACERS ALL FINISH PASS" /tmp/pack-18.log
          grep -q "AI ITEM USE" /tmp/pack-18.log
          grep -q "AI SKILL USE" /tmp/pack-18.log
          grep -q "AI PACK TACTIC" /tmp/pack-18.log
          grep -q "AI SHORTCUT PASS" /tmp/pack-18.log
          grep -q "RANK SYSTEM PASS racers=18" /tmp/pack-18.log
          echo "AI ITEM USE PASS"
          echo "AI SKILL USE PASS"

      - name: Re-run 10 25 50 racer performance benchmark
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then
              export WILDDASH_OPTIMIZED=1
            else
              export WILDDASH_OPTIMIZED=0
            fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/wilddash-pack-perf-${profile}-${racers}.log"
              timeout 18s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
                --headless --path godot res://benchmark/race_benchmark.tscn | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done
