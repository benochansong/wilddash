name: WILD DASH Grand Prix Pack CI

# Heavy/specialized validation. This branch temporarily uses the existing
# default-branch manual workflow entry point to validate RC6 AI balance before
# merge. It remains workflow_dispatch only and is restored after validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-dash-rc6-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc6-ai-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import RC6 project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Validate Normal 15 racers
        run: |
          set -o pipefail
          export WILDDASH_BALANCE_RACERS=15
          export WILDDASH_BALANCE_RUNS=1
          export WILDDASH_BALANCE_RUN_INDEX=1
          export WILDDASH_BALANCE_SEED=7601
          export WILDDASH_BALANCE_RUN=1
          export WILDDASH_REALTIME_BALANCE=1
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc6-balance-15"
          rm -rf "$XDG_DATA_HOME"
          timeout 320s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/ai_race_balance_probe.tscn \
            | tee /tmp/rc6-balance-15.log
          grep -q "AI_BALANCE_PASS racers=15 run=1 seed=7601" /tmp/rc6-balance-15.log
          grep "AI_BALANCE_RESULT" /tmp/rc6-balance-15.log >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Hard 18 racers
        run: |
          set -o pipefail
          export WILDDASH_BALANCE_RACERS=18
          export WILDDASH_BALANCE_RUNS=1
          export WILDDASH_BALANCE_RUN_INDEX=1
          export WILDDASH_BALANCE_SEED=7901
          export WILDDASH_BALANCE_RUN=1
          export WILDDASH_REALTIME_BALANCE=1
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc6-balance-18"
          rm -rf "$XDG_DATA_HOME"
          timeout 320s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/ai_race_balance_probe.tscn \
            | tee /tmp/rc6-balance-18.log
          grep -q "AI_BALANCE_PASS racers=18 run=1 seed=7901" /tmp/rc6-balance-18.log
          grep "AI_BALANCE_RESULT" /tmp/rc6-balance-18.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RC6 AI balance telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-RC6-AI-Balance-Smoke
          path: /tmp/rc6-balance-*.log
          if-no-files-found: warn
          retention-days: 14
