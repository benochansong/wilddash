name: WILD DASH Grand Prix Pack CI

# Heavy/specialized validation. Run manually from the Actions tab when needed
# instead of on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grand-prix-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify RaceManager Progress Cache V2
        run: |
          set -o pipefail
          export WILDDASH_PROGRESS_CACHE=1
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot --script res://tests/race_progress_cache_v2_smoke.gd \
            | tee /tmp/progress-cache-v2.log
          grep -q "RACE PROGRESS CACHE V2 PASS" /tmp/progress-cache-v2.log

      # This workflow validates Round 1 only. It deliberately runs the isolated
      # Grand Prix probe instead of booting the full campaign, so adding later
      # rounds cannot create unrelated timeouts here.
      - name: Verify Casual 10-racer field
        run: |
          set -o pipefail
          export WILDDASH_RC5_RACERS=10
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-10"
          timeout 110s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_grand_prix_probe.tscn \
            | tee /tmp/pack-10.log
          grep -q "RC5 PROBE START racers=10 ai=9" /tmp/pack-10.log
          grep -q "RC5 ALL FINISH PASS racers=10" /tmp/pack-10.log
          grep -q "RC5 INTERACTION FLOW PASS" /tmp/pack-10.log
          grep -q "RC5 GRAND PRIX PROBE PASS racers=10 realtime=false" /tmp/pack-10.log

      - name: Verify Normal 15-racer gameplay target
        run: |
          set -o pipefail
          export WILDDASH_RC5_RACERS=15
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-15"
          timeout 110s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_grand_prix_probe.tscn \
            | tee /tmp/pack-15.log
          grep -q "RC5 PROBE START racers=15 ai=14" /tmp/pack-15.log
          grep -q "RC5 ALL FINISH PASS racers=15" /tmp/pack-15.log
          grep -q "RC5 INTERACTION FLOW PASS" /tmp/pack-15.log
          grep -q "RC5 GRAND PRIX PROBE PASS racers=15 realtime=false" /tmp/pack-15.log

      - name: Verify Hard 18-racer field
        run: |
          set -o pipefail
          export WILDDASH_RC5_RACERS=18
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-pack-18"
          timeout 110s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_grand_prix_probe.tscn \
            | tee /tmp/pack-18.log
          grep -q "RC5 PROBE START racers=18 ai=17" /tmp/pack-18.log
          grep -q "RC5 ALL FINISH PASS racers=18" /tmp/pack-18.log
          grep -q "RC5 INTERACTION FLOW PASS" /tmp/pack-18.log
          grep -q "RC5 GRAND PRIX PROBE PASS racers=18 realtime=false" /tmp/pack-18.log

      - name: Re-run 10 25 50 racer performance benchmark
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then
              export WILDDASH_OPTIMIZED=1
            else
              export WILDDASH_OPTIMIZED=0
            fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/wilddash-pack-perf-${profile}-${racers}.log"
              timeout 18s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
                --headless --path godot res://benchmark/race_benchmark.tscn | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done
