name: WILD DASH RC5 Gameplay Challenge

on:
  push:
    branches:
      - feature/rc5-gameplay-challenge
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/rc5-gameplay-challenge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC5 candidate
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import RC5 project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify release systems and controls
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/release_candidate_systems.tscn | tee /tmp/rc5-systems.log
          grep -q "RC_SYSTEMS PASS" /tmp/rc5-systems.log

      - name: Verify Character Select and Chimera Lab
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/character_select_chimera_smoke.tscn | tee /tmp/rc5-select.log
          grep -q "CHARACTER SELECT" /tmp/rc5-select.log

      - name: Verify four skills and AI skill utility
        run: |
          set -o pipefail
          timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/skill_system_smoke.tscn | tee /tmp/rc5-skills.log
          grep -q "DOG SKILL PASS" /tmp/rc5-skills.log
          grep -q "RABBIT SKILL PASS" /tmp/rc5-skills.log
          grep -q "ELEPHANT SKILL PASS" /tmp/rc5-skills.log
          grep -q "CAT SKILL PASS" /tmp/rc5-skills.log
          grep -q "AI SKILL USE PASS" /tmp/rc5-skills.log

      - name: Verify twelve items and AI item utility
        run: |
          set -o pipefail
          timeout 40s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_expansion_smoke.tscn | tee /tmp/rc5-items.log
          grep -q "ITEM COUNT PASS count=12" /tmp/rc5-items.log
          grep -q "AI NEW ITEM USE PASS items=6" /tmp/rc5-items.log
          grep -q "ITEM EXPANSION SMOKE PASS items=12" /tmp/rc5-items.log

      - name: Verify extended Grand Prix track
        run: |
          set -o pipefail
          timeout 35s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_track_smoke.tscn | tee /tmp/rc5-track.log
          grep -q "TRACK LENGTH PASS" /tmp/rc5-track.log
          grep -q "CHECKPOINT PASS count=11" /tmp/rc5-track.log
          grep -q "SHORTCUT A PASS" /tmp/rc5-track.log
          grep -q "SHORTCUT B PASS" /tmp/rc5-track.log

      - name: Verify RC5 balance ceilings
        run: |
          set -o pipefail
          timeout 35s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_gameplay_challenge.tscn | tee /tmp/rc5-balance.log
          grep -q "RC5 SHIELD WEIGHT PASS" /tmp/rc5-balance.log
          grep -q "RC5 CHIMERA CAP PASS" /tmp/rc5-balance.log
          grep -q "RC5 TRACK CHALLENGE PASS" /tmp/rc5-balance.log
          grep -q "RC5 GAMEPLAY CHALLENGE PASS" /tmp/rc5-balance.log

      - name: Probe Normal 15-racer production pace and interaction flow
        run: |
          set -o pipefail
          export WILDDASH_RC5_RACERS=15
          export WILDDASH_REALTIME_BALANCE=1
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc5-probe-15"
          timeout 245s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_grand_prix_probe.tscn | tee /tmp/rc5-probe-15.log
          grep -q "RC5 ALL FINISH PASS racers=15" /tmp/rc5-probe-15.log
          grep -q "RC5 INTERACTION FLOW PASS" /tmp/rc5-probe-15.log
          grep -q "RC5 NORMAL PACE PASS" /tmp/rc5-probe-15.log
          grep -q "RC5 GRAND PRIX PROBE PASS racers=15 realtime=true" /tmp/rc5-probe-15.log

      - name: Probe Hard 18-racer challenge
        run: |
          set -o pipefail
          unset WILDDASH_REALTIME_BALANCE
          export WILDDASH_RC5_RACERS=18
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc5-probe-18"
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_grand_prix_probe.tscn | tee /tmp/rc5-probe-18.log
          grep -q "RC5 ALL FINISH PASS racers=18" /tmp/rc5-probe-18.log
          grep -q "RC5 INTERACTION FLOW PASS" /tmp/rc5-probe-18.log
          grep -q "RC5 GRAND PRIX PROBE PASS racers=18 realtime=false" /tmp/rc5-probe-18.log

      - name: Run four-round Normal campaign regression
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=14
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc5-campaign"
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/rc5-campaign.log
          grep -q "GRAND PRIX COMPLETE racers=15 finishers=15" /tmp/rc5-campaign.log
          grep -q "RC_FLOW Round 2" /tmp/rc5-campaign.log
          grep -q "RC_FLOW Round 3" /tmp/rc5-campaign.log
          grep -q "RC_FLOW Final" /tmp/rc5-campaign.log
          grep -q "CAMPAIGN COMPLETE rounds=4" /tmp/rc5-campaign.log
          grep -q "RC_SAVE result_saved=true" /tmp/rc5-campaign.log
          echo "RC5 FOUR ROUND CAMPAIGN PASS"

      - name: Benchmark 10 25 50 racers baseline and optimized
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then
              export WILDDASH_OPTIMIZED=1
            else
              export WILDDASH_OPTIMIZED=0
            fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/rc5-perf-${profile}-${racers}.log"
              timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
                --headless --path godot res://benchmark/race_benchmark.tscn | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done

      - name: Upload RC5 validation telemetry
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-RC5-Gameplay-Challenge-Logs
          path: /tmp/rc5-*.log
          if-no-files-found: error
          retention-days: 14

  windows-unsigned-candidate:
    needs: validate-rc5
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout RC5 candidate
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.zip"
          Expand-Archive "$env:RUNNER_TEMP\templates.zip" "$env:RUNNER_TEMP\templates" -Force
          $templateDir = "$env:APPDATA\Godot\export_templates\4.7.1.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateDir -Recurse -Force
          $godotFile = Get-ChildItem "$env:RUNNER_TEMP\godot\*console.exe" | Select-Object -First 1
          if ($null -eq $godotFile) { throw "Godot console executable not found" }
          "GODOT_EXE=$($godotFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $godotFile.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project on Windows
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path godot --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows x64 RC5 internal candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "godot\build\windows" | Out-Null
          & $env:GODOT_EXE --headless --path godot --export-release "Windows Desktop" "build/windows/WILD_DASH_3D_RC5.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = (Resolve-Path "godot\build\windows\WILD_DASH_3D_RC5.exe").Path
          Write-Host "RC5 WINDOWS EXPORT bytes=$((Get-Item $exe).Length) path=$exe"

      - name: Smoke launch RC5 executable
        shell: pwsh
        run: |
          $env:WILDDASH_AUTOTEST_LOAD_ONLY = "1"
          $exe = (Resolve-Path "godot\build\windows\WILD_DASH_3D_RC5.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless" -PassThru -Wait
          Write-Host "RC5 WINDOWS SMOKE EXIT=$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "RC5 executable smoke test failed" }

      - name: Package unsigned RC5 INTERNAL TEST
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          Copy-Item "godot\build\windows\WILD_DASH_3D_RC5.exe" "dist\WILD_DASH_3D_RC5.exe"
          @"
          WILD DASH RC5 — Gameplay Challenge
          Version 0.9.0-rc5

          UNSIGNED INTERNAL TEST BUILD.
          This artifact is NOT a public signed RC5 pre-release.
          No Trusted Authenticode signature is asserted by this workflow.
          Windows SmartScreen / Smart App Control may warn or block this executable.
          Publish a public RC5 pre-release only after trusted code signing is configured and verified.
          "@ | Set-Content "dist\UNSIGNED_INTERNAL_TEST.txt" -Encoding UTF8
          Compress-Archive -Path "dist\WILD_DASH_3D_RC5.exe","dist\UNSIGNED_INTERNAL_TEST.txt" -DestinationPath "dist\WILD_DASH_3D_0.9.0-rc5_Windows_x64_UNSIGNED_INTERNAL.zip" -Force
          $hash = (Get-FileHash "dist\WILD_DASH_3D_0.9.0-rc5_Windows_x64_UNSIGNED_INTERNAL.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  WILD_DASH_3D_0.9.0-rc5_Windows_x64_UNSIGNED_INTERNAL.zip" | Set-Content "dist\SHA256.txt" -Encoding ASCII
          Get-ChildItem dist | Format-Table Name,Length
          Get-Content "dist\SHA256.txt"

      - name: Upload RC5 unsigned internal candidate
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-3D-RC5-Unsigned-Internal
          path: |
            dist/WILD_DASH_3D_RC5.exe
            dist/WILD_DASH_3D_0.9.0-rc5_Windows_x64_UNSIGNED_INTERNAL.zip
            dist/UNSIGNED_INTERNAL_TEST.txt
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
