name: ESLint Stabilization Verify

on:
  push:
    branches:
      - stabilization/wilddash-prototype

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Add ESLint React TypeScript dependencies
        run: npm install --save-dev @eslint/js@9.39.4 typescript-eslint eslint-plugin-react-hooks globals

      - name: Apply minimal lint fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (before !== after) fs.writeFileSync(path, after);
          }

          edit('app/Race3D.tsx', (text) =>
            text.replaceAll('useSkill', 'activateSkill').replaceAll('useItem', 'activateItem')
          );

          edit('app/page.tsx', (text) =>
            text
              .replaceAll('useSkill', 'activateSkill')
              .replaceAll('useItem', 'activateItem')
              .replaceAll('\u3000', ' ')
          );

          edit('app/ArenaRound.tsx', (text) => {
            let next = text.replace(
              'import { useEffect, useRef, useState } from "react";',
              'import { useCallback, useEffect, useRef, useState } from "react";'
            );
            next = next.replace('  const shove = () => {', '  const shove = useCallback(() => {');
            next = next.replace(
              '  };\n\n  useEffect(() => {\n    const down =',
              '  }, [haptics, sound]);\n\n  useEffect(() => {\n    const down ='
            );
            next = next.replace(
              '  }, []);\n\n  useEffect(() => {\n    let frame',
              '  }, [shove]);\n\n  useEffect(() => {\n    let frame'
            );
            return next;
          });
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Persist stabilization changes
        run: |
          if git diff --quiet; then
            echo "No stabilization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/Race3D.tsx app/page.tsx app/Tutorial.tsx app/ArenaRound.tsx
          git commit -m "chore: finish ESLint hook stabilization [skip ci]"
          git push
