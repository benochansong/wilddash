name: ESLint Stabilization Verify

on:
  push:
    branches:
      - stabilization/wilddash-prototype

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Add ESLint React TypeScript dependencies
        run: npm install --save-dev @eslint/js@9.39.4 typescript-eslint eslint-plugin-react-hooks globals

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Persist ESLint dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add ESLint React TypeScript dependencies [skip ci]"
          git push
