name: WILD DASH CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-dash-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Vite production build
        run: npm run build

      - name: Verify desktop build shell
        run: npm run test:desktop

  windows-installer:
    name: Windows installer
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "WILD-DASH-50-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "WILD DASH Windows installer was not created." }
          Write-Host "Installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: wild-dash-windows-installer
          path: release/WILD-DASH-50-Setup-*.exe
          if-no-files-found: error
