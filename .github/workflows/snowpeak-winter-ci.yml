name: WILD DASH Snowpeak Winter CI

on:
  pull_request:
    paths:
      - "godot/tracks/snowpeak_winter_track.gd"
      - "godot/tracks/snowpeak_winter_track.tscn"
      - "godot/modes/snowpeak_winter_rally/**"
      - "godot/effects/snowfall_controller.gd"
      - "godot/systems/winter_surface_controller.gd"
      - "godot/systems/racing_feel_controller.gd"
      - "godot/scripts/game_manager.gd"
      - "godot/tests/snowpeak_winter_*.gd"
      - "godot/tests/snowpeak_winter_*.tscn"
      - "godot/tests/rc5_gameplay_challenge.gd"
      - ".github/workflows/snowpeak-winter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-snowpeak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify Snowpeak track contract
        run: |
          set -o pipefail
          timeout 40s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/snowpeak_winter_track_smoke.tscn \
            | tee /tmp/snowpeak-track.log
          grep -q "SNOWPEAK TRACK LOAD PASS" /tmp/snowpeak-track.log
          grep -q "SNOWPEAK ENVIRONMENT PASS" /tmp/snowpeak-track.log
          grep -q "SNOWPEAK SURFACE PASS" /tmp/snowpeak-track.log
          grep -q "SNOWPEAK FINISH PASS checkpoints=10" /tmp/snowpeak-track.log
          grep -q "SNOWPEAK TRACK SMOKE PASS" /tmp/snowpeak-track.log

      - name: Verify RC5 five-round contract
        run: |
          set -o pipefail
          timeout 45s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc5_gameplay_challenge.tscn \
            | tee /tmp/rc5-snowpeak.log
          grep -q "RC5 ROUND5 SNOWPEAK PASS" /tmp/rc5-snowpeak.log
          grep -q "RC5 GAMEPLAY CHALLENGE PASS" /tmp/rc5-snowpeak.log

      - name: Probe Snowpeak Normal 15 racers
        run: |
          set -o pipefail
          export WILDDASH_SNOWPEAK_RACERS=15
          export XDG_DATA_HOME="$RUNNER_TEMP/snowpeak-15"
          timeout 135s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/snowpeak_winter_race_probe.tscn \
            | tee /tmp/snowpeak-15.log
          grep -q "SNOWPEAK ALL FINISH PASS racers=15 finishers=15" /tmp/snowpeak-15.log
          grep -q "SNOWPEAK NPC VARIETY PASS species=12 roster=12" /tmp/snowpeak-15.log
          grep -q "SNOWPEAK PROBE PASS racers=15 checkpoints=10" /tmp/snowpeak-15.log

      - name: Probe Snowpeak Hard 18 racers
        run: |
          set -o pipefail
          export WILDDASH_SNOWPEAK_RACERS=18
          export XDG_DATA_HOME="$RUNNER_TEMP/snowpeak-18"
          timeout 135s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/snowpeak_winter_race_probe.tscn \
            | tee /tmp/snowpeak-18.log
          grep -q "SNOWPEAK ALL FINISH PASS racers=18 finishers=18" /tmp/snowpeak-18.log
          grep -q "SNOWPEAK NPC VARIETY PASS species=12 roster=12" /tmp/snowpeak-18.log
          grep -q "SNOWPEAK PROBE PASS racers=18 checkpoints=10" /tmp/snowpeak-18.log
