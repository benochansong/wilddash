name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and benchmark scene headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify four-animal character system
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/character_system_smoke.tscn \
            | tee /tmp/wilddash-characters.log
          grep -q "CHARACTER PROFILE id=dog" /tmp/wilddash-characters.log
          grep -q "CHARACTER PROFILE id=rabbit" /tmp/wilddash-characters.log
          grep -q "CHARACTER PROFILE id=elephant" /tmp/wilddash-characters.log
          grep -q "CHARACTER PROFILE id=cat" /tmp/wilddash-characters.log
          grep -q "CHARACTER SYSTEM PASS animals=4 states=7" /tmp/wilddash-characters.log

      - name: Verify character skill gameplay and AI utility
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/skill_system_smoke.tscn \
            | tee /tmp/wilddash-skills.log
          grep -q "SKILL INPUT PASS keyboard=E gamepad=X item=Q/B separate=true" /tmp/wilddash-skills.log
          grep -q "DOG SKILL PASS" /tmp/wilddash-skills.log
          grep -q "RABBIT SKILL PASS" /tmp/wilddash-skills.log
          grep -q "ELEPHANT SKILL PASS" /tmp/wilddash-skills.log
          grep -q "CAT SKILL PASS" /tmp/wilddash-skills.log
          grep -q "AI SKILL USE PASS" /tmp/wilddash-skills.log
          grep -q "CHARACTER SKILL SYSTEM PASS skills=4 chimera=true item_separate=true" /tmp/wilddash-skills.log

      - name: Verify chimera composition system
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/chimera_system_smoke.tscn \
            | tee /tmp/wilddash-chimera.log
          grep -q "CHIMERA HEAD SKILL PASS" /tmp/wilddash-chimera.log
          grep -q "CHIMERA BODY PASSIVE PASS" /tmp/wilddash-chimera.log
          grep -q "CHIMERA TAIL BONUS PASS" /tmp/wilddash-chimera.log
          grep -q "CHIMERA PROFILE head=rabbit body=elephant tail=cat" /tmp/wilddash-chimera.log
          grep -q "CHIMERA SYSTEM PASS slots=3 palettes=4 patterns=4 save_version=2" /tmp/wilddash-chimera.log

      - name: Verify Character Select and Chimera Lab integration
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/character_select_chimera_smoke.tscn \
            | tee /tmp/wilddash-character-select.log
          grep -q "CHARACTER SELECT READY basic=4 chimera=true" /tmp/wilddash-character-select.log
          grep -q "CHARACTER SELECT CHIMERA PASS basic=rabbit head=rabbit body=elephant tail=cat" /tmp/wilddash-character-select.log

      - name: Verify main-race Grand Prix track targets
        run: |
          set -o pipefail
          timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_track_smoke.tscn \
            | tee /tmp/wilddash-grand-prix-track.log
          grep -q "TRACK LENGTH PASS" /tmp/wilddash-grand-prix-track.log
          grep -q "PLAYER ROUTE VALID PASS points=30" /tmp/wilddash-grand-prix-track.log
          grep -q "CHECKPOINT PASS count=11" /tmp/wilddash-grand-prix-track.log
          grep -q "SHORTCUT A PASS" /tmp/wilddash-grand-prix-track.log
          grep -q "SHORTCUT B PASS" /tmp/wilddash-grand-prix-track.log
          grep -q "TRACK NODE BUDGET PASS" /tmp/wilddash-grand-prix-track.log
          grep -q "FINISH VALIDATION PASS" /tmp/wilddash-grand-prix-track.log

      - name: Verify legacy six-item party racing gameplay
        run: |
          set -o pipefail
          timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_system_smoke.tscn \
            | tee /tmp/wilddash-items.log
          grep -q "ITEM BOX PICKUP PASS" /tmp/wilddash-items.log
          grep -q "ITEM INVENTORY PASS" /tmp/wilddash-items.log
          grep -q "DASH BERRY PASS" /tmp/wilddash-items.log
          grep -q "SHIELD PASS" /tmp/wilddash-items.log
          grep -q "TRAP PASS" /tmp/wilddash-items.log
          grep -q "SHOCKWAVE PASS" /tmp/wilddash-items.log
          grep -q "ROCKET PASS" /tmp/wilddash-items.log
          grep -q "FEATHER PASS" /tmp/wilddash-items.log
          grep -q "AI ITEM USE PASS" /tmp/wilddash-items.log
          grep -q "ITEM SYSTEM SMOKE PASS items=6 inventory=1" /tmp/wilddash-items.log

      - name: Verify twelve-item combat expansion and AI utility
        run: |
          set -o pipefail
          timeout 35s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_expansion_smoke.tscn \
            | tee /tmp/wilddash-item-expansion.log
          grep -q "ITEM COUNT PASS count=12" /tmp/wilddash-item-expansion.log
          grep -q "ITEM DEFINITION PASS roles=5 icons=12" /tmp/wilddash-item-expansion.log
          grep -q "SUPER CARROT PASS" /tmp/wilddash-item-expansion.log
          grep -q "ACORN BOMB PASS" /tmp/wilddash-item-expansion.log
          grep -q "BANANA PEEL PASS" /tmp/wilddash-item-expansion.log
          grep -q "MAGNET PASS" /tmp/wilddash-item-expansion.log
          grep -q "WIND BOOST PASS" /tmp/wilddash-item-expansion.log
          grep -q "GHOST FRUIT PASS" /tmp/wilddash-item-expansion.log
          grep -q "ITEM HISTORY PASS recent=2" /tmp/wilddash-item-expansion.log
          grep -q "AI NEW ITEM USE PASS items=6" /tmp/wilddash-item-expansion.log
          grep -q "ITEM EXPANSION SMOKE PASS items=12 roles=5 history=2" /tmp/wilddash-item-expansion.log

      - name: Verify 10 15 18 racer density configuration
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_density_smoke.tscn \
            | tee /tmp/wilddash-density.log
          grep -q "DIFFICULTY RACER COUNT PASS casual=10 normal=15 hard=18" /tmp/wilddash-density.log
          grep -q "AI COUNT OPTION PASS ai=10/14/18" /tmp/wilddash-density.log
          grep -q "AI PERSONALITY CONFIG PASS profiles=5 decision_hz=6" /tmp/wilddash-density.log
          grep -q "AI DECISION RATE PASS item_hz=5 skill_hz=5 tactical_hz=6" /tmp/wilddash-density.log
          grep -q "RANK SYSTEM PASS" /tmp/wilddash-density.log
          grep -q "GRAND PRIX DENSITY SMOKE PASS target=15 hard=18 optional_ai=18" /tmp/wilddash-density.log

      - name: Run casual-density campaign with nine AI (10 racers)
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=9
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-10-racers"
          rm -rf "$XDG_DATA_HOME"
          timeout 140s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot-10-racers.log
          grep -q "GRAND PRIX START racers=10 ai=9 checkpoints=11" /tmp/wilddash-godot-10-racers.log
          grep -q "START GRID PASS racers=10" /tmp/wilddash-godot-10-racers.log
          grep -q "GRAND PRIX ITEM BOXES READY count=38 stations=11 respawn=5.0s" /tmp/wilddash-godot-10-racers.log
          grep -q "AI ITEM USE" /tmp/wilddash-godot-10-racers.log
          grep -q "AI SKILL USE" /tmp/wilddash-godot-10-racers.log
          grep -q "AI SHORTCUT PASS" /tmp/wilddash-godot-10-racers.log
          grep -q "10 RACERS PASS" /tmp/wilddash-godot-10-racers.log
          grep -q "10 RACERS ALL FINISH PASS" /tmp/wilddash-godot-10-racers.log
          grep -q "GRAND PRIX COMPLETE racers=10 finishers=10" /tmp/wilddash-godot-10-racers.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-10-racers.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-10-racers.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-10-racers.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot-10-racers.log
          echo "4 ROUND CAMPAIGN PASS racers=10"

      - name: Validate target Grand Prix with fourteen AI (15 racers)
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=14
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-15-racers"
          rm -rf "$XDG_DATA_HOME"
          timeout 155s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot-15-racers.log
          grep -q "GRAND PRIX START racers=15 ai=14 checkpoints=11" /tmp/wilddash-godot-15-racers.log
          grep -q "START GRID PASS racers=15" /tmp/wilddash-godot-15-racers.log
          grep -q "GRAND PRIX ITEM BOXES READY count=38 stations=11 respawn=4.2s" /tmp/wilddash-godot-15-racers.log
          grep -q "AI PERSONALITY PASS profiles=5 tactical_hz=6" /tmp/wilddash-godot-15-racers.log
          grep -q "AI ITEM USE" /tmp/wilddash-godot-15-racers.log
          grep -q "AI SKILL USE" /tmp/wilddash-godot-15-racers.log
          grep -q "AI SHORTCUT PASS" /tmp/wilddash-godot-15-racers.log
          grep -q "15 RACERS PASS" /tmp/wilddash-godot-15-racers.log
          grep -q "15 RACERS ALL FINISH PASS" /tmp/wilddash-godot-15-racers.log
          grep -q "GRAND PRIX COMPLETE racers=15 finishers=15" /tmp/wilddash-godot-15-racers.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-15-racers.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-15-racers.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-15-racers.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot-15-racers.log
          echo "4 ROUND CAMPAIGN PASS racers=15"

      - name: Validate hard Grand Prix with seventeen AI (18 racers)
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=17
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-18-racers"
          rm -rf "$XDG_DATA_HOME"
          timeout 170s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot-18-racers.log
          grep -q "GRAND PRIX START racers=18 ai=17 checkpoints=11" /tmp/wilddash-godot-18-racers.log
          grep -q "START GRID PASS racers=18" /tmp/wilddash-godot-18-racers.log
          grep -q "GRAND PRIX ITEM BOXES READY count=38 stations=11 respawn=3.7s" /tmp/wilddash-godot-18-racers.log
          grep -q "AI PERSONALITY PASS profiles=5 tactical_hz=6" /tmp/wilddash-godot-18-racers.log
          grep -q "AI ITEM USE" /tmp/wilddash-godot-18-racers.log
          grep -q "AI SKILL USE" /tmp/wilddash-godot-18-racers.log
          grep -q "AI SHORTCUT PASS" /tmp/wilddash-godot-18-racers.log
          grep -q "18 RACERS PASS" /tmp/wilddash-godot-18-racers.log
          grep -q "18 RACERS ALL FINISH PASS" /tmp/wilddash-godot-18-racers.log
          grep -q "GRAND PRIX COMPLETE racers=18 finishers=18" /tmp/wilddash-godot-18-racers.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-18-racers.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-18-racers.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-18-racers.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot-18-racers.log
          echo "4 ROUND CAMPAIGN PASS racers=18"

      - name: Benchmark 10 25 50 racers before and after optimization
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then
              export WILDDASH_OPTIMIZED=1
            else
              export WILDDASH_OPTIMIZED=0
            fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/wilddash-perf-${profile}-${racers}.log"
              timeout 18s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
                --headless --path godot res://benchmark/race_benchmark.tscn \
                | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done
