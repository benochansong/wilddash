name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Run four-racer vertical slice headlessly
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot --fixed-fps 60 --quit-after 1200 \
            | tee /tmp/wilddash-godot.log
          grep -q "WILD DASH 3D Vertical Slice 01 ready" /tmp/wilddash-godot.log
          grep -q "PLAYER FINISH" /tmp/wilddash-godot.log
          grep -q "RACE COMPLETE" /tmp/wilddash-godot.log
