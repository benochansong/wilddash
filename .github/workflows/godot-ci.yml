name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-dash-godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
