name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import all four round scenes headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Run four-round campaign with four AI
        run: |
          set -o pipefail
          timeout 55s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot.log
          grep -q "WILD DASH 3D four-round campaign ready: ai=4" /tmp/wilddash-godot.log
          grep -q "MODE START id=grand_prix ai=4" /tmp/wilddash-godot.log
          grep -q "GRAND PRIX COMPLETE racers=5 finishers=5" /tmp/wilddash-godot.log
          grep -q "MODE COMPLETE id=grand_prix" /tmp/wilddash-godot.log
          grep -q "MODE START id=fruit_collection ai=4" /tmp/wilddash-godot.log
          grep -q "MODE COMPLETE id=fruit_collection" /tmp/wilddash-godot.log
          grep -q "MODE START id=floor_collapse ai=4" /tmp/wilddash-godot.log
          grep -q "MODE COMPLETE id=floor_collapse" /tmp/wilddash-godot.log
          grep -q "MODE START id=push_out ai=4" /tmp/wilddash-godot.log
          grep -q "MODE COMPLETE id=push_out" /tmp/wilddash-godot.log
          grep -q "CAMPAIGN COMPLETE rounds=4" /tmp/wilddash-godot.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot.log
