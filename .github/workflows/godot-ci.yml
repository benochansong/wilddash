name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
      - release/wilddash-3d-rc2
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify four-animal character system
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot res://tests/character_system_smoke.tscn | tee /tmp/wilddash-characters.log
          grep -q "CHARACTER SYSTEM PASS animals=4 states=7" /tmp/wilddash-characters.log

      - name: Verify chimera composition system
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot res://tests/chimera_system_smoke.tscn | tee /tmp/wilddash-chimera.log
          grep -q "CHIMERA SYSTEM PASS slots=3 palettes=4 patterns=4 save_version=2" /tmp/wilddash-chimera.log

      - name: Verify Character Select and Chimera Lab integration
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot res://tests/character_select_chimera_smoke.tscn | tee /tmp/wilddash-character-select.log
          grep -q "CHARACTER SELECT READY basic=4 chimera=true" /tmp/wilddash-character-select.log
          grep -q "CHARACTER SELECT CHIMERA PASS basic=rabbit head=rabbit body=elephant tail=cat" /tmp/wilddash-character-select.log

      - name: Run four-round campaign with four AI
        run: |
          set -o pipefail
          timeout 55s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/wilddash-godot-4.log
          grep -q "GRAND PRIX COMPLETE racers=5 finishers=5" /tmp/wilddash-godot-4.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-4.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-4.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-4.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot-4.log

      - name: Stress four-round campaign with ten AI
        run: |
          set -o pipefail
          export WILDDASH_AI_COUNT=10
          timeout 65s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/wilddash-godot-10.log
          grep -q "GRAND PRIX COMPLETE racers=11 finishers=11" /tmp/wilddash-godot-10.log
          grep -q "HEADLESS RESULT rounds=4" /tmp/wilddash-godot-10.log

      - name: Benchmark 10 25 50 racers before and after optimization
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then export WILDDASH_OPTIMIZED=1; else export WILDDASH_OPTIMIZED=0; fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/wilddash-perf-${profile}-${racers}.log"
              timeout 18s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot res://benchmark/race_benchmark.tscn | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done

  windows-export-rc2:
    needs: validate-godot
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 console editor and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.zip"
          Expand-Archive "$env:RUNNER_TEMP\templates.zip" "$env:RUNNER_TEMP\templates" -Force
          $templateDir = "$env:APPDATA\Godot\export_templates\4.7.1.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateDir -Recurse -Force
          $godot = (Get-ChildItem "$env:RUNNER_TEMP\godot\Godot_v4.7.1-stable_win64_console.exe").FullName
          if (-not (Test-Path $godot)) { throw "Godot console executable was not found" }
          "GODOT_EXE=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $godot --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import RC2 project on Windows
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path godot --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export smoke-test and publish Windows RC2 pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path $PWD "godot\build\windows"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          & $env:GODOT_EXE --headless --path godot --export-release "Windows Desktop" "build/windows/WILD_DASH_3D_RC2.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot RC2 export failed with code $LASTEXITCODE" }

          $exe = Join-Path $outDir "WILD_DASH_3D_RC2.exe"
          if (-not (Test-Path $exe)) { throw "RC2 Windows executable was not generated" }
          $item = Get-Item $exe
          Write-Host "RC2_EXE_READY path=$($item.FullName) bytes=$($item.Length)"

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $shaFile = Join-Path $outDir "WILD_DASH_3D_RC2.sha256"
          "$hash  WILD_DASH_3D_RC2.exe" | Set-Content $shaFile

          $env:WILDDASH_AI_COUNT = "4"
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "RC2 executable exited with code $($proc.ExitCode)" }
          Write-Host "RC2_SMOKE_PASS exit=0"

          $zip = Join-Path $env:RUNNER_TEMP "WILD-DASH-3D-Windows-RC2-Character-Chimera.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe,$shaFile -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "RC2 ZIP package was not generated" }
          Write-Host "RC2_PACKAGE_READY path=$zip bytes=$((Get-Item $zip).Length) sha256=$hash"

          $tag = "v0.9.0-rc2"
          $title = "WILD DASH 3D RC2 — Character & Chimera Build"
          $notes = @"
          Windows x64 Release Candidate 2.

          Includes:
          - Dog / Rabbit / Elephant / Cat character system V2
          - Character Select with live 3D preview
          - Chimera Lab: Head / Body / Tail composition
          - Chimera palette and pattern customization
          - Chimera Save v2
          - Four-round Godot 3D campaign
          - Windows export verified by headless smoke launch

          This is a pre-release playtest build. Character art is still low-poly placeholder content.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload RC2 release asset" }
          } else {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create RC2 pre-release" }
          }

          $releaseUrl = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseUrl)) { throw "RC2 release verification failed" }
          Write-Host "RC2_RELEASE_PUBLISHED tag=$tag url=$releaseUrl asset=$(Split-Path $zip -Leaf)"
