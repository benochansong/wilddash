name: WILD DASH Godot CI

on:
  pull_request:
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  push:
    branches:
      - main
      - godot/wilddash-next
      - release/wilddash-3d-rc1
    paths:
      - "godot/**"
      - "scripts/benchmark-windows.ps1"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import release candidate project headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify input audio settings save and pause systems
        run: |
          set -o pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-system-test"
          rm -rf "$XDG_DATA_HOME"
          timeout 15s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/release_candidate_systems.tscn \
            | tee /tmp/wilddash-systems.log
          grep -q "RC_SYSTEMS PASS" /tmp/wilddash-systems.log

      - name: Run launch to result flow with four AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=4
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-4"
          rm -rf "$XDG_DATA_HOME"
          timeout 55s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Launch" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Lobby" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Character Select" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Race" /tmp/wilddash-godot-4.log
          grep -q "GRAND PRIX COMPLETE racers=5 finishers=5" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Round 2" /tmp/wilddash-godot-4.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Round 3" /tmp/wilddash-godot-4.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Final" /tmp/wilddash-godot-4.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-4.log
          grep -q "RC_FLOW Result" /tmp/wilddash-godot-4.log
          grep -q "RC_SAVE result_saved=true" /tmp/wilddash-godot-4.log

      - name: Restart and confirm save load
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST_LOAD_ONLY=1
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-4"
          timeout 12s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-restart.log
          grep -q "RC_FLOW Lobby" /tmp/wilddash-restart.log
          grep -q "RC_SAVE_LOADED launches=2 campaigns=1 last_character=dog" /tmp/wilddash-restart.log

      - name: Stress four-round campaign with ten AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=10
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-flow-10"
          rm -rf "$XDG_DATA_HOME"
          timeout 65s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            | tee /tmp/wilddash-godot-10.log
          grep -q "GRAND PRIX COMPLETE racers=11 finishers=11" /tmp/wilddash-godot-10.log
          grep -q "FRUIT AI PICKUP" /tmp/wilddash-godot-10.log
          grep -q "FLOOR PHASE 1" /tmp/wilddash-godot-10.log
          grep -q "PUSH OUT AI BODY CHECK" /tmp/wilddash-godot-10.log
          grep -q "RC_SAVE result_saved=true" /tmp/wilddash-godot-10.log

      - name: Benchmark 10 25 50 racers before and after optimization
        run: |
          set -o pipefail
          for profile in baseline optimized; do
            if [ "$profile" = "optimized" ]; then
              export WILDDASH_OPTIMIZED=1
            else
              export WILDDASH_OPTIMIZED=0
            fi
            for racers in 10 25 50; do
              export WILDDASH_RACER_COUNT=$racers
              log="/tmp/wilddash-perf-${profile}-${racers}.log"
              timeout 18s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
                --headless --path godot res://benchmark/race_benchmark.tscn \
                | tee "$log"
              grep -q "PERF_RESULT profile=${profile} racers=${racers}" "$log"
              grep -q "BENCHMARK RACE COMPLETE profile=${profile} racers=${racers}" "$log"
            done
          done

  windows-export:
    needs: validate-godot
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 editor and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.zip"
          Expand-Archive "$env:RUNNER_TEMP\templates.zip" "$env:RUNNER_TEMP\templates" -Force
          $templateDir = "$env:APPDATA\Godot\export_templates\4.7.1.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateDir -Recurse -Force
          $godot = (Get-ChildItem "$env:RUNNER_TEMP\godot\Godot_v4.7.1-stable_win64.exe").FullName
          "GODOT_EXE=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $godot --version

      - name: Import project on Windows
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path godot --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows x86_64 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "godot\build\windows" | Out-Null
          & $env:GODOT_EXE --headless --path godot --export-release "Windows Desktop" "build/windows/WILD_DASH_3D.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "godot\build\windows\WILD_DASH_3D.exe")) { throw "Windows executable was not generated" }

      - name: Smoke launch exported executable
        shell: pwsh
        run: |
          $env:WILDDASH_AUTOTEST_LOAD_ONLY = "1"
          $proc = Start-Process -FilePath "godot\build\windows\WILD_DASH_3D.exe" -ArgumentList "--headless" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Exported executable exited with code $($proc.ExitCode)" }

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-3D-Windows-RC1
          path: godot/build/windows/WILD_DASH_3D.exe
          if-no-files-found: error
