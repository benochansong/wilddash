name: WILD DASH Item Box Pickup CI

on:
  pull_request:
    paths:
      - "godot/items/item_box.gd"
      - "godot/tests/item_box_race_pickup_regression.gd"
      - "godot/tests/item_box_race_pickup_regression.tscn"
      - ".github/workflows/item-box-pickup-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-item-box-pickup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify universal race item box pickup
        run: |
          set -o pipefail
          timeout 40s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_box_race_pickup_regression.tscn \
            | tee /tmp/item-box-pickup.log
          grep -q "ITEM BOX SWEPT PLAYER PASS" /tmp/item-box-pickup.log
          grep -q "ITEM BOX PLAYER REPLACE PASS" /tmp/item-box-pickup.log
          grep -q "ITEM BOX AI ONE SLOT PASS" /tmp/item-box-pickup.log
          grep -q "ITEM BOX RACE PICKUP REGRESSION PASS" /tmp/item-box-pickup.log
