name: WILD DASH Race Collision CI

# Collision-specific regression suite. Run manually when collision/barrier
# behavior changes instead of on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-race-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify universal race environment collision
        run: |
          set -o pipefail
          timeout 70s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/race_environment_collision_regression.tscn \
            | tee /tmp/race-collision.log
          grep -q "ROUND1 HARD BARRIER PASS" /tmp/race-collision.log
          grep -q "ROUND3 HARD BARRIER PASS" /tmp/race-collision.log
          grep -q "ROUND5 HARD BARRIER PASS" /tmp/race-collision.log
          grep -q "BOOST COLLISION PASS" /tmp/race-collision.log
          grep -q "CORNER SLIP COLLISION PASS" /tmp/race-collision.log
          grep -q "RACE ENV COLLISION REGRESSION PASS" /tmp/race-collision.log

      - name: Verify universal Item Box pickup remains intact
        run: |
          set -o pipefail
          timeout 45s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_box_race_pickup_regression.tscn \
            | tee /tmp/item-box.log
          grep -q "ITEM BOX RACE PICKUP REGRESSION PASS" /tmp/item-box.log
