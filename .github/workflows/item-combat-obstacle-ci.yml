name: WILD DASH Item Combat & Obstacles CI

# Heavy/specialized validation. Run manually when item combat or obstacle
# behavior changes instead of on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-item-combat-obstacles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify Item Box pickup baseline
        run: |
          set -o pipefail
          timeout 45s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_box_race_pickup_regression.tscn \
            | tee /tmp/item-box.log
          grep -q "ITEM BOX RACE PICKUP REGRESSION PASS" /tmp/item-box.log

      - name: Verify 18-item combat matrix and reliable fire fallback
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_combat_expansion_regression.tscn \
            | tee /tmp/item-combat.log
          grep -q "ITEM MATRIX PASS base=12 expanded=6 total=18" /tmp/item-combat.log
          grep -q "ITEM FIRE RELIABILITY PASS" /tmp/item-combat.log
          grep -q "ITEM COMBAT EXPANSION REGRESSION PASS" /tmp/item-combat.log

      - name: Verify themed race obstacles
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/race_obstacle_expansion_regression.tscn \
            | tee /tmp/obstacles.log
          grep -q "ROUND1 OBSTACLE PASS" /tmp/obstacles.log
          grep -q "ROUND3 OBSTACLE PASS" /tmp/obstacles.log
          grep -q "ROUND5 OBSTACLE PASS" /tmp/obstacles.log
          grep -q "RACE OBSTACLE EXPANSION REGRESSION PASS" /tmp/obstacles.log

      - name: Verify tunnel collision regression remains intact
        run: |
          set -o pipefail
          timeout 70s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/race_environment_collision_regression.tscn \
            | tee /tmp/collision.log
          grep -q "RACE ENV COLLISION REGRESSION PASS" /tmp/collision.log
