name: Audio Refactor Verify

on:
  push:
    branches:
      - stabilization/wilddash-prototype

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply audio refactor
        run: node scripts/audio-refactor.cjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify centralized AudioContext
        run: |
          if grep -R -E 'new Audio(Context|Ctx)[[:space:]]*\(' app --include='*.tsx'; then
            echo 'React component still creates AudioContext directly.'
            exit 1
          fi

      - name: Persist audio refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/Race3D.tsx app/ArenaRound.tsx
          git commit -m "refactor: centralize gameplay audio [skip ci]"
          git push
