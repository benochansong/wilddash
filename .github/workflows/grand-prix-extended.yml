name: WILD DASH Extended Grand Prix

on:
  push:
    branches:
      - feature/grand-prix-2p4km-rc4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-extended-grand-prix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout extended track branch
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify extended track geometry checkpoints and shortcuts
        run: |
          set -o pipefail
          timeout 35s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_track_smoke.tscn | tee /tmp/extended-track.log
          grep -q "TRACK LENGTH PASS 2200-2600m" /tmp/extended-track.log
          grep -q "CHECKPOINT PASS count=11" /tmp/extended-track.log
          grep -q "SHORTCUT A PASS" /tmp/extended-track.log
          grep -q "SHORTCUT B PASS" /tmp/extended-track.log
          grep -q "PLAYER ROUTE VALID PASS" /tmp/extended-track.log
          grep -q "FINISH VALIDATION PASS" /tmp/extended-track.log

      - name: Verify geometry-aware player clean-lap pacing
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_pace_smoke.tscn | tee /tmp/extended-pace.log
          grep -q "PLAYER PACE ESTIMATE.*no_teleport=true.*geometry_aware=true" /tmp/extended-pace.log
          grep -q "PLAYER RACE TIME PASS" /tmp/extended-pace.log

      - name: Run Normal campaign with four AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_DIFFICULTY=normal
          export WILDDASH_AI_COUNT=4
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-extended-4"
          rm -rf "$XDG_DATA_HOME"
          timeout 150s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/extended-4.log
          grep -q "GRAND PRIX START racers=5 ai=4 checkpoints=11" /tmp/extended-4.log
          grep -q "item_boxes=33" /tmp/extended-4.log
          grep -q "AI SHORTCUT ROUTE.*animal=rabbit.*A=true" /tmp/extended-4.log
          grep -q "AI SHORTCUT ROUTE.*animal=dog.*B=true" /tmp/extended-4.log
          grep -q "AI SHORTCUT SAFETY PASS" /tmp/extended-4.log
          grep -q "GRAND PRIX COMPLETE racers=5 finishers=5" /tmp/extended-4.log
          grep -q "AI ITEM USE" /tmp/extended-4.log
          grep -q "AI SKILL USE" /tmp/extended-4.log
          grep -q "RC_FLOW Result" /tmp/extended-4.log
          echo "4 AI COMPLETE PASS"
          echo "4 ROUND CAMPAIGN PASS ai=4"

      - name: Run Normal campaign with ten AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_DIFFICULTY=normal
          export WILDDASH_AI_COUNT=10
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-extended-10"
          rm -rf "$XDG_DATA_HOME"
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/extended-10.log
          grep -q "GRAND PRIX COMPLETE racers=11 finishers=11" /tmp/extended-10.log
          grep -q "AI ITEM USE" /tmp/extended-10.log
          grep -q "AI SKILL USE" /tmp/extended-10.log
          grep -q "RC_FLOW Result" /tmp/extended-10.log
          echo "10 AI COMPLETE PASS"
          echo "4 ROUND CAMPAIGN PASS ai=10"

      - name: Run Hard campaign with fourteen AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_DIFFICULTY=hard
          export WILDDASH_AI_COUNT=14
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-extended-14"
          rm -rf "$XDG_DATA_HOME"
          timeout 220s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/extended-14.log
          grep -q "GRAND PRIX COMPLETE racers=15 finishers=15" /tmp/extended-14.log
          grep -q "AI SHORTCUT ROUTE" /tmp/extended-14.log
          grep -q "AI ITEM USE" /tmp/extended-14.log
          grep -q "AI SKILL USE" /tmp/extended-14.log
          grep -q "RC_FLOW Result" /tmp/extended-14.log
          echo "14 AI COMPLETE PASS"
          echo "4 ROUND CAMPAIGN PASS ai=14"

      - name: Benchmark 10 25 50 racers
        run: |
          set -o pipefail
          for racers in 10 25 50; do
            export WILDDASH_OPTIMIZED=1
            export WILDDASH_RACER_COUNT=$racers
            timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
              --headless --path godot res://benchmark/race_benchmark.tscn | tee "/tmp/extended-perf-${racers}.log"
            grep -q "PERF_RESULT profile=optimized racers=${racers}" "/tmp/extended-perf-${racers}.log"
            grep -q "BENCHMARK RACE COMPLETE profile=optimized racers=${racers}" "/tmp/extended-perf-${racers}.log"
          done

      - name: Upload extended Grand Prix logs
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-extended-grand-prix-logs
          path: /tmp/extended-*.log
          if-no-files-found: error
