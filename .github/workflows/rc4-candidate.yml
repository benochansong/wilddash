name: WILD DASH 3D RC4 Candidate

on:
  push:
    branches:
      - release/wilddash-3d-rc4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC4
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import RC4 project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Verify release systems
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/release_candidate_systems.tscn | tee /tmp/rc4-systems.log
          grep -q "RC_SYSTEMS PASS" /tmp/rc4-systems.log

      - name: Verify character skills and AI skill use
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/skill_system_smoke.tscn | tee /tmp/rc4-skills.log
          grep -q "DOG SKILL PASS" /tmp/rc4-skills.log
          grep -q "RABBIT SKILL PASS" /tmp/rc4-skills.log
          grep -q "ELEPHANT SKILL PASS" /tmp/rc4-skills.log
          grep -q "CAT SKILL PASS" /tmp/rc4-skills.log
          grep -q "AI SKILL USE PASS" /tmp/rc4-skills.log

      - name: Verify Chimera gameplay build
        run: |
          set -o pipefail
          timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/chimera_system_smoke.tscn | tee /tmp/rc4-chimera.log
          grep -q "CHIMERA HEAD SKILL PASS" /tmp/rc4-chimera.log
          grep -q "CHIMERA BODY PASSIVE PASS" /tmp/rc4-chimera.log
          grep -q "CHIMERA TAIL BONUS PASS" /tmp/rc4-chimera.log

      - name: Verify track checkpoints shortcuts and finish validation
        run: |
          set -o pipefail
          timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/grand_prix_track_smoke.tscn | tee /tmp/rc4-track.log
          grep -q "TRACK LENGTH PASS" /tmp/rc4-track.log
          grep -q "PLAYER ROUTE VALID PASS points=30" /tmp/rc4-track.log
          grep -q "CHECKPOINT PASS count=11" /tmp/rc4-track.log
          grep -q "SHORTCUT A PASS" /tmp/rc4-track.log
          grep -q "SHORTCUT B PASS" /tmp/rc4-track.log
          grep -q "TRACK NODE BUDGET PASS" /tmp/rc4-track.log
          grep -q "FINISH VALIDATION PASS" /tmp/rc4-track.log

      - name: Verify six-item system and AI item use
        run: |
          set -o pipefail
          timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/item_system_smoke.tscn | tee /tmp/rc4-items.log
          grep -q "ITEM SYSTEM SMOKE PASS items=6" /tmp/rc4-items.log
          grep -q "AI ITEM USE PASS" /tmp/rc4-items.log

      - name: Verify gameplay balance gates
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot res://tests/rc3_gameplay_balance.tscn | tee /tmp/rc4-balance.log
          grep -q "RC3 BALANCE PASS" /tmp/rc4-balance.log

      - name: Run four-round campaign with four AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=4
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc4-flow-4"
          rm -rf "$XDG_DATA_HOME"
          timeout 125s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/rc4-flow-4.log
          grep -q "GRAND PRIX START racers=5 ai=4 checkpoints=11" /tmp/rc4-flow-4.log
          grep -q "GRAND PRIX ITEM BOXES READY count=33 stations=11" /tmp/rc4-flow-4.log
          grep -q "4 AI COMPLETE PASS" /tmp/rc4-flow-4.log
          grep -q "GRAND PRIX COMPLETE racers=5 finishers=5" /tmp/rc4-flow-4.log
          grep -q "AI SHORTCUT A ROUTE" /tmp/rc4-flow-4.log
          grep -q "AI SHORTCUT B ROUTE" /tmp/rc4-flow-4.log
          grep -q "AI ITEM USE" /tmp/rc4-flow-4.log
          grep -q "AI SKILL USE" /tmp/rc4-flow-4.log
          grep -q "RC_FLOW Result" /tmp/rc4-flow-4.log
          grep -q "RC_SAVE result_saved=true" /tmp/rc4-flow-4.log
          echo "4 ROUND CAMPAIGN PASS ai=4"

      - name: Stress four-round campaign with ten AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=10
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc4-flow-10"
          rm -rf "$XDG_DATA_HOME"
          timeout 140s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/rc4-flow-10.log
          grep -q "GRAND PRIX START racers=11 ai=10 checkpoints=11" /tmp/rc4-flow-10.log
          grep -q "GRAND PRIX ITEM BOXES READY count=33 stations=11" /tmp/rc4-flow-10.log
          grep -q "10 AI COMPLETE PASS" /tmp/rc4-flow-10.log
          grep -q "GRAND PRIX COMPLETE racers=11 finishers=11" /tmp/rc4-flow-10.log
          grep -q "AI ITEM USE" /tmp/rc4-flow-10.log
          grep -q "AI SKILL USE" /tmp/rc4-flow-10.log
          grep -q "RC_SAVE result_saved=true" /tmp/rc4-flow-10.log
          echo "4 ROUND CAMPAIGN PASS ai=10"

      - name: Stress four-round campaign with fourteen AI
        run: |
          set -o pipefail
          export WILDDASH_AUTOTEST=1
          export WILDDASH_AI_COUNT=14
          export XDG_DATA_HOME="$RUNNER_TEMP/wilddash-rc4-flow-14"
          rm -rf "$XDG_DATA_HOME"
          timeout 155s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot | tee /tmp/rc4-flow-14.log
          grep -q "GRAND PRIX START racers=15 ai=14 checkpoints=11" /tmp/rc4-flow-14.log
          grep -q "GRAND PRIX ITEM BOXES READY count=33 stations=11" /tmp/rc4-flow-14.log
          grep -q "14 AI COMPLETE PASS" /tmp/rc4-flow-14.log
          grep -q "GRAND PRIX COMPLETE racers=15 finishers=15" /tmp/rc4-flow-14.log
          grep -q "AI ITEM USE" /tmp/rc4-flow-14.log
          grep -q "AI SKILL USE" /tmp/rc4-flow-14.log
          grep -q "RC_SAVE result_saved=true" /tmp/rc4-flow-14.log
          echo "4 ROUND CAMPAIGN PASS ai=14"

      - name: Benchmark 10 25 50 racers
        run: |
          set -o pipefail
          for racers in 10 25 50; do
            export WILDDASH_OPTIMIZED=1
            export WILDDASH_RACER_COUNT=$racers
            timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
              --headless --path godot res://benchmark/race_benchmark.tscn | tee "/tmp/rc4-perf-${racers}.log"
            grep -q "PERF_RESULT profile=optimized racers=${racers}" "/tmp/rc4-perf-${racers}.log"
            grep -q "BENCHMARK RACE COMPLETE profile=optimized racers=${racers}" "/tmp/rc4-perf-${racers}.log"
          done

      - name: Upload validation logs
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-RC4-validation-logs
          path: /tmp/rc4-*.log
          if-no-files-found: error

  windows-unsigned-candidate:
    needs: validate-rc4
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout RC4
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" "$env:RUNNER_TEMP\godot" -Force
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.zip"
          Expand-Archive "$env:RUNNER_TEMP\templates.zip" "$env:RUNNER_TEMP\templates" -Force
          $templateDir = "$env:APPDATA\Godot\export_templates\4.7.1.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $templateDir -Recurse -Force
          $godotFile = Get-ChildItem "$env:RUNNER_TEMP\godot\*console.exe" | Select-Object -First 1
          if ($null -eq $godotFile) { throw "Godot console executable not found" }
          "GODOT_EXE=$($godotFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $godotFile.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project on Windows
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path godot --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows x64 RC4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "godot\build\windows" | Out-Null
          & $env:GODOT_EXE --headless --path godot --export-release "Windows Desktop" "build/windows/WILD_DASH_3D_RC4.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = (Resolve-Path "godot\build\windows\WILD_DASH_3D_RC4.exe").Path
          Write-Host "RC4 WINDOWS EXPORT bytes=$((Get-Item $exe).Length) path=$exe"

      - name: Smoke launch RC4 executable
        shell: pwsh
        run: |
          $env:WILDDASH_AUTOTEST_LOAD_ONLY = "1"
          $exe = (Resolve-Path "godot\build\windows\WILD_DASH_3D_RC4.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless" -PassThru -Wait
          Write-Host "RC4 WINDOWS SMOKE EXIT=$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "RC4 executable smoke test failed" }

      - name: Package unsigned internal RC4 candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          Copy-Item "godot\build\windows\WILD_DASH_3D_RC4.exe" "dist\WILD_DASH_3D_RC4.exe"
          @"
          WILD DASH 3D RC4 — Windows Hardening + Gameplay Upgrade
          Version 0.9.0-rc4

          UNSIGNED INTERNAL TEST BUILD.
          This candidate is not the signed public RC4 release.
          Windows Smart App Control / SmartScreen may block or warn on this executable.
          The v0.9.0-rc4 tag is reserved for a trusted signed build.
          "@ | Set-Content "dist\UNSIGNED_INTERNAL_TEST.txt" -Encoding UTF8
          Compress-Archive -Path "dist\WILD_DASH_3D_RC4.exe","dist\UNSIGNED_INTERNAL_TEST.txt" -DestinationPath "dist\WILD_DASH_3D_0.9.0-rc4_Windows_x64_UNSIGNED_INTERNAL.zip" -Force
          $hash = (Get-FileHash "dist\WILD_DASH_3D_0.9.0-rc4_Windows_x64_UNSIGNED_INTERNAL.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  WILD_DASH_3D_0.9.0-rc4_Windows_x64_UNSIGNED_INTERNAL.zip" | Set-Content "dist\SHA256.txt" -Encoding ASCII
          Get-ChildItem dist | Format-Table Name,Length
          Get-Content "dist\SHA256.txt"

      - name: Upload RC4 internal candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: WILD-DASH-3D-RC4-Unsigned-Internal
          path: |
            dist/WILD_DASH_3D_RC4.exe
            dist/WILD_DASH_3D_0.9.0-rc4_Windows_x64_UNSIGNED_INTERNAL.zip
            dist/UNSIGNED_INTERNAL_TEST.txt
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
