name: WILD DASH Godot Parse Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-dash-godot-parse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-parse:
    name: Godot 4.7.1 Round 1 + Round 3 parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and register scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path godot --quit \
            2>&1 | tee /tmp/wilddash-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Parse Error:|Failed to load script|Could not resolve script|Cannot get class" /tmp/wilddash-import.log; then
            echo "Godot import found a parser/script error."
            exit 1
          fi

      - name: Load production Round 1 scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            res://modes/grand_prix/grand_prix.tscn \
            --quit-after 5 \
            2>&1 | tee /tmp/wilddash-round1-load.log
          if grep -E "SCRIPT ERROR: Parse Error|Parse Error:|Failed to load script|Could not resolve script|Cannot get class|Failed loading resource|Failed to load resource" /tmp/wilddash-round1-load.log; then
            echo "Round 1 scene load found a parser/resource error."
            exit 1
          fi

      - name: Load production Round 3 scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path godot \
            res://modes/logspire_leap/logspire_leap.tscn \
            --quit-after 5 \
            2>&1 | tee /tmp/wilddash-round3-load.log
          if grep -E "SCRIPT ERROR: Parse Error|Parse Error:|Failed to load script|Could not resolve script|Cannot get class|Failed loading resource|Failed to load resource" /tmp/wilddash-round3-load.log; then
            echo "Round 3 scene load found a parser/resource error."
            exit 1
          fi

      - name: Confirm production scenes parsed
        run: echo "ROUND 1 + ROUND 3 GODOT PARSE PASS"
